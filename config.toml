# proxy-farm-9router — konfigurasi bot

[database]
# Path database 9router. Nilai di bawah adalah DEFAULT Windows 11 (Acer).
# `src/util.resolve_db_path()` menangani tiga hal, berurutan:
#   1. path di sini, setelah expandvars + expanduser, bila file-nya ada;
#   2. %APPDATA%\9router\db\data.sqlite bila ada (Windows);
#   3. ~/.9router/db/data.sqlite (Linux/macOS).
# Jadi file ini boleh dibiarkan begini di kedua mesin — resolusi otomatis.
path = "%APPDATA%/9router/db/data.sqlite"
backup_dir = "backups"
keep_backups = 10

[logging]
enabled = true
level = "INFO"          # DEBUG, INFO, WARNING, ERROR
dir = "logs"
file = "farm.log"
max_bytes = 5242880    # 5 MB
backup_count = 5       # Simpan 5 rotasi cadangan log

[farm]
# Kandidat yang diambil per putaran SETELAH dedup + sampling round-robin.
max_candidates = 15000
# Koneksi paralel. 250 terbukti stabil di router rumahan dua mesin ini.
concurrency = 250
connect_timeout = 4.0

# Endpoint uji HTTPS nyata:
# 9router membutuhkan tunneling HTTPS (CONNECT) untuk berkomunikasi dengan
# upstream AI API (Google Gemini, OpenRouter, Kilocode, dll).
# Proxy yang berhasil mengembalikan IPv4 dari endpoint ini terbukti:
#  1. Mampu melakukan HTTPS tunnel (TLS CONNECT).
#  2. Tidak mengembalikan HTML error / Cloudflare 403 palsu.
#  3. Tidak membocorkan IP lokal mesin.
exit_ip_endpoints = ["https://api.ipify.org", "https://icanhazip.com"]
# Batas kandidat yang masuk uji exit-IP, diambil dari yang TCP-nya tercepat.
# 0 = uji semua (jauh lebih lama). 1000 cukup untuk mengisi target 50 proxy.
deep_test_top_n = 1000
deep_test_timeout = 5.0

# Proxy yang gagal uji: langsung dibuang agar DB bebas dari proxy zombie.
# 1 = gagal pada run ini langsung dipangkas dari DB.
grace_strikes = 1

# Target proxy hidup BARU per putaran. Begitu tercapai, sisa kandidat
# dibatalkan (early-exit hemat waktu). 0 = uji semua tanpa batas.
target_fresh_alive = 50

[opencode]
# Validasi langsung ke model OpenCode deepseek-v4.1-flash-free:
# Proxy yang diblokir Cloudflare 403 (Abusive traffic) atau timeout
# langsung dibuang. Hanya proxy yang benar-benar bisa menghasilkan
# respon AI yang disuntikkan ke DB.
validate = true
model = "oc/deepseek-v4.1-flash-free"
timeout = 5.0
max_verified = 20

[test]
mode = "deep"

[scope]
# RUANG AMAN: vercel & cloudflare TIDAK PERNAH disentuh (read-only).
# Semua recheck/prune hanya berlaku pada type=http (custom + hasil farm).
recheck_types = ["http"]
prune_types = ["http"]
# false = semua proxy custom (type=http) yang mati akan dipangkas,
# termasuk sisa lama v1 (free-*). Vercel & Cloudflare tetap 100% aman.
only_prune_owned = false

[order]
# Susunan daftar di dashboard 9router: custom (paling atas) -> vercel -> cloudflare
groups = ["http", "vercel", "cloudflare"]
